name: final-v1-maintenance

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/final-v1-maintenance.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply final release and close-policy hardening
        shell: python
        run: |
          from pathlib import Path

          release = Path('.github/workflows/release.yml')
          text = release.read_text(encoding='utf-8-sig')
          text = text.replace(
              "      - name: Optionally Authenticode-sign Setup\n        if: ${{ secrets.LEDGERFORGE_SIGNING_CERT_BASE64 != '' }}\n        shell: pwsh\n",
              "      - name: Optionally Authenticode-sign Setup\n        shell: pwsh\n",
              1)
          needle = "          $pfx = Join-Path $env:RUNNER_TEMP 'ledgerforge-signing.pfx'\n"
          replacement = """          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64)) {
            Write-Host 'No Authenticode signing certificate is configured; continuing with checksum-verified unsigned Setup.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PASSWORD)) {
            throw 'LEDGERFORGE_SIGNING_CERT_PASSWORD must be configured when a signing certificate is provided.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'ledgerforge-signing.pfx'
"""
          if needle not in text:
              raise SystemExit('Release signing insertion point not found.')
          text = text.replace(needle, replacement, 1)
          release.write_text(text, encoding='utf-8')

          hygiene = Path('.github/workflows/public-hygiene.yml')
          text = hygiene.read_text(encoding='utf-8-sig')
          text = text.replace(" -- ':!docs/PROJECT_HANDOFF.md'", " --", 1)
          hygiene.write_text(text, encoding='utf-8')

          fiscal = Path('src/LedgerForge.Infrastructure/Budgeting/FiscalYearAdministrationService.cs')
          text = fiscal.read_text(encoding='utf-8-sig')
          old = '''        var openPurchaseOrders = await dbContext.PurchaseOrders.AsNoTracking()
              .CountAsync(x => x.FiscalYearId == fiscalYearId &&
                  x.State != PurchaseOrderState.Closed &&
                  x.State != PurchaseOrderState.Cancelled &&
                  x.State != PurchaseOrderState.Rejected &&
                  x.State != PurchaseOrderState.Issued,
                  cancellationToken);'''
          new = '''        var openPurchaseOrders = await dbContext.PurchaseOrders.AsNoTracking()
              .CountAsync(x => x.FiscalYearId == fiscalYearId &&
                  x.State != PurchaseOrderState.Closed &&
                  x.State != PurchaseOrderState.Cancelled &&
                  x.State != PurchaseOrderState.Rejected,
                  cancellationToken);'''
          if old not in text:
              raise SystemExit('Fiscal close PO policy block not found.')
          text = text.replace(old, new, 1)
          text = text.replace(
              'purchase order(s) are still draft, pending, or approved but not issued/closed.',
              'purchase order(s) are not explicitly closed, cancelled, or rejected.',
              1)
          fiscal.write_text(text, encoding='utf-8')

      - name: Remove one-shot workflow and commit changes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/final-v1-maintenance.yml
          git add .github/workflows/release.yml .github/workflows/public-hygiene.yml src/LedgerForge.Infrastructure/Budgeting/FiscalYearAdministrationService.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden LedgerForge v1 release and close policy'
          git push origin HEAD:${{ github.head_ref }}
