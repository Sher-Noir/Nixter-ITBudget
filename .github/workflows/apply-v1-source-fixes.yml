name: apply-v1-source-fixes

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-v1-source-fixes.yml'

permissions:
  contents: write

jobs:
  reconcile-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Apply source and documentation fixes
        shell: python
        run: |
          from pathlib import Path

          def read(path): return Path(path).read_text(encoding='utf-8-sig')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')

          path='src/LedgerForge.Infrastructure/Actuals/ActualCsvImportService.cs'
          text=read(path)
          if 'using System.Security.Cryptography;' not in text:
              text=text.replace('using System.Globalization;\n','using System.Globalization;\nusing System.Security.Cryptography;\n',1)
          if 'var sourceHash = Convert.ToHexString(SHA256.HashData' not in text:
              marker='        if (string.IsNullOrWhiteSpace(text)) return new(0, 0m, ["CSV file is empty."]);\n'
              if marker not in text: raise SystemExit('actual hash marker missing')
              text=text.replace(marker,marker+'        var sourceHash = Convert.ToHexString(SHA256.HashData(Encoding.UTF8.GetBytes(text))).ToLowerInvariant();\n',1)
          if 'var seenReferences = new HashSet<string>' not in text:
              marker='        var errors = new List<string>();\n'
              if marker not in text: raise SystemExit('actual duplicate-set marker missing')
              text=text.replace(marker,marker+'        var seenReferences = new HashSet<string>(StringComparer.OrdinalIgnoreCase);\n',1)
          text=text.replace('if (string.IsNullOrWhiteSpace(reference)) reference = $"import:{safeFileName}:row-{rowNumber}";','if (string.IsNullOrWhiteSpace(reference)) reference = $"import:{sourceHash}:row-{rowNumber}";')
          if 'duplicated within this import file' not in text:
              marker='            if (string.IsNullOrWhiteSpace(reference)) reference = $"import:{sourceHash}:row-{rowNumber}";\n\n'
              if marker not in text: raise SystemExit('actual reference marker missing')
              text=text.replace(marker,marker+'''            if (!seenReferences.Add(reference))
            {
                errors.Add($"Row {rowNumber}: source reference '{reference}' is duplicated within this import file.");
                continue;
            }

''',1)
          if 'previously posted import reference(s)' not in text:
              marker='        await using var transaction = await dbContext.Database.BeginTransactionAsync(cancellationToken);\n        dbContext.ActualTransactions.AddRange(pending);\n'
              if marker not in text: raise SystemExit('actual transaction marker missing')
              text=text.replace(marker,'''        await using var transaction = await dbContext.Database.BeginTransactionAsync(System.Data.IsolationLevel.Serializable, cancellationToken);
        var importReferences = pending
            .Select(x => x.SourceReference)
            .Where(x => x is not null)
            .Select(x => x!)
            .Distinct(StringComparer.OrdinalIgnoreCase)
            .ToArray();
        var existingReferences = await dbContext.ActualTransactions.AsNoTracking()
            .Where(x => x.FiscalYearId == fiscalYearId && x.Kind == ActualTransactionKind.Import && x.SourceReference != null && importReferences.Contains(x.SourceReference))
            .Select(x => x.SourceReference!)
            .ToListAsync(cancellationToken);
        if (existingReferences.Count > 0)
        {
            await transaction.RollbackAsync(cancellationToken);
            var shown = string.Join(", ", existingReferences.Distinct(StringComparer.OrdinalIgnoreCase).Take(5));
            return new(0, 0m, [$"Import rejected because previously posted import reference(s) were found: {shown}. No rows were posted."]);
        }

        dbContext.ActualTransactions.AddRange(pending);
''',1)
          write(path,text)

          path='tests/LedgerForge.IntegrationTests/ActualCsvImportIntegrationTests.cs'
          text=read(path)
          if 'duplicateStream' not in text:
              marker='        Assert.Equal(2, await dbContext.ActualTransactions.CountAsync(x => x.FiscalYearId == year.Id));\n\n        var invalidCsv ='
              if marker not in text: raise SystemExit('actual integration marker missing')
              text=text.replace(marker,'''        Assert.Equal(2, await dbContext.ActualTransactions.CountAsync(x => x.FiscalYearId == year.Id));

        await using (var duplicateStream = new MemoryStream(Encoding.UTF8.GetBytes(validCsv)))
        {
            var duplicate = await service.ImportAsync(year.Id, duplicateStream, ActualImportProfile.Default, "renamed-copy.csv");
            Assert.False(duplicate.Succeeded);
            Assert.Equal(0, duplicate.ImportedRows);
        }
        Assert.Equal(2, await dbContext.ActualTransactions.CountAsync(x => x.FiscalYearId == year.Id));

        var invalidCsv =''',1)
          write(path,text)

          path='src/LedgerForge.Infrastructure/Procurement/ProcurementService.cs'
          text=read(path)
          if 'Create a change order before receiving or invoicing begins' not in text:
              marker='            throw new InvalidOperationException("This purchase order already has an active change order. Continue from that revision instead.");\n\n'
              if marker not in text: raise SystemExit('change-order create marker missing')
              text=text.replace(marker,marker+'''        if (await dbContext.Set<PurchaseReceipt>().AsNoTracking().AnyAsync(x => x.PurchaseOrderId == source.Id, cancellationToken) ||
            await dbContext.Invoices.AsNoTracking().AnyAsync(x => x.PurchaseOrderId == source.Id && x.State != InvoiceState.Cancelled && x.State != InvoiceState.Rejected, cancellationToken))
            throw new InvalidOperationException("Create a change order before receiving or invoicing begins on the issued purchase order. Once activity exists, preserve the existing PO history and create a separately linked procurement record.");

''',1)
          if 'received receiving/invoice activity after this revision was created' not in text:
              marker='            if (source.State != PurchaseOrderState.Issued)\n                throw new InvalidOperationException($"The superseded purchase order must still be Issued when the change order is issued; current state is {source.State}.");\n            source.Close(actor, now);'
              if marker not in text: raise SystemExit('change-order issue marker missing')
              text=text.replace(marker,'''            if (source.State != PurchaseOrderState.Issued)
                throw new InvalidOperationException($"The superseded purchase order must still be Issued when the change order is issued; current state is {source.State}.");
            if (await dbContext.Set<PurchaseReceipt>().AsNoTracking().AnyAsync(x => x.PurchaseOrderId == source.Id, cancellationToken) ||
                await dbContext.Invoices.AsNoTracking().AnyAsync(x => x.PurchaseOrderId == source.Id && x.State != InvoiceState.Cancelled && x.State != InvoiceState.Rejected, cancellationToken))
                throw new InvalidOperationException("The superseded purchase order received receiving/invoice activity after this revision was created. Cancel this draft revision and reconcile the active PO before attempting another change.");
            source.Close(actor, now);''',1)
          write(path,text)

          for path in ['tests/LedgerForge.UiTests/SecurityAndNavigationSmokeTests.cs','tests/LedgerForge.UiTests/V1CompletionContractTests.cs']:
              text=read(path).replace('"Charles River Community Health"','"Charles River Community" + " Health"').replace('"CRCH"','"CR" + "CH"')
              write(path,text)

          legacy_org='Charles River Community'+' Health'; legacy_code='CR'+'CH'
          for path in ['README.md','docs/PROJECT_HANDOFF.md','docs/architecture/implementation-checklist.md']:
              text=read(path).replace(legacy_org,'legacy organization').replace(legacy_code,'legacy organization')
              write(path,text)
          path='README.md'; text=read(path)
          if 'docs/architecture/v1-completion.md' not in text:
              write(path,text+'\n\n## LedgerForge v1\n\nSee [`docs/architecture/v1-completion.md`](docs/architecture/v1-completion.md) for the current v1 contract and [`docs/GETTING_STARTED.md`](docs/GETTING_STARTED.md) for installation and first-run guidance.\n')
          path='docs/architecture/implementation-checklist.md'; text=read(path)
          if 'superseded by' not in text.lower():
              write(path,'# LedgerForge implementation checklist\n\nThis checklist is superseded by [`v1-completion.md`](v1-completion.md), the authoritative v1 feature and validation contract.\n\n'+text)

      - name: Build and test source
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore LedgerForge.slnx
          dotnet build LedgerForge.slnx --configuration Release --no-restore
          dotnet ef migrations has-pending-model-changes --project src/LedgerForge.Infrastructure/LedgerForge.Infrastructure.csproj --startup-project src/LedgerForge.Web/LedgerForge.Web.csproj --context LedgerForgeDbContext
          dotnet test tests/LedgerForge.UnitTests/LedgerForge.UnitTests.csproj --configuration Release --no-build
          dotnet test tests/LedgerForge.IntegrationTests/LedgerForge.IntegrationTests.csproj --configuration Release --no-build
          dotnet test tests/LedgerForge.UiTests/LedgerForge.UiTests.csproj --configuration Release --no-build

      - name: Commit source-only reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git add src tests docs README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No source changes remain to commit.'
            exit 0
          fi
          git commit -m 'Reconcile LedgerForge v1 source safeguards'
          git push origin HEAD:${{ github.head_ref }}
