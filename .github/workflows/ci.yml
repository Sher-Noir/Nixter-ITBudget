name: ci
on:
  push:
    branches: [ main, 'agent/**' ]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
      - run: dotnet restore LedgerForge.slnx
      - run: dotnet build LedgerForge.slnx --configuration Release --no-restore
      - run: dotnet test LedgerForge.slnx --configuration Release --no-build --logger "trx;LogFileName=ledgerforge-tests.trx"
