name: generate-forecast-baseline-migration

# One-shot workflow: generate, review/backfill, commit, then remove this workflow.
on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/generate-forecast-baseline-migration.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore EF tool and solution
        run: |
          dotnet tool restore
          dotnet restore LedgerForge.slnx
      - name: Generate EF migration from the current model
        run: |
          dotnet ef migrations add AddForecastBaselineSnapshot \
            --project src/LedgerForge.Infrastructure/LedgerForge.Infrastructure.csproj \
            --startup-project src/LedgerForge.Web/LedgerForge.Web.csproj \
            --context LedgerForgeDbContext \
            --output-dir Persistence/Migrations
      - name: Preserve existing forecast baselines during upgrade
        shell: python
        run: |
          from pathlib import Path
          import re

          migration = next(Path('src/LedgerForge.Infrastructure/Persistence/Migrations').glob('*_AddForecastBaselineSnapshot.cs'))
          text = migration.read_text(encoding='utf-8-sig')
          pattern = re.compile(
              r'(?P<indent>[ \t]*)migrationBuilder\.AddColumn<decimal>\(\s*'
              r'name: "BaselineTotal",\s*table: "ForecastLine",\s*'
              r'type: "decimal\(19,4\)",\s*nullable: false'
              r'(?:,\s*defaultValue: 0m)?\);',
              re.MULTILINE)
          match = pattern.search(text)
          if not match:
              raise SystemExit('Expected generated BaselineTotal AddColumn operation was not found; review EF output manually.')
          indent = match.group('indent')
          reviewed = f'''{indent}migrationBuilder.AddColumn<decimal>(
          {indent}    name: "BaselineTotal",
          {indent}    table: "ForecastLine",
          {indent}    type: "decimal(19,4)",
          {indent}    nullable: true);

          {indent}migrationBuilder.Sql("""
          {indent}    UPDATE [ForecastLine]
          {indent}    SET [BaselineTotal] = [ForecastTotal]
          {indent}    WHERE [BaselineTotal] IS NULL;
          {indent}    """);

          {indent}migrationBuilder.AlterColumn<decimal>(
          {indent}    name: "BaselineTotal",
          {indent}    table: "ForecastLine",
          {indent}    type: "decimal(19,4)",
          {indent}    nullable: false,
          {indent}    oldClrType: typeof(decimal),
          {indent}    oldType: "decimal(19,4)",
          {indent}    oldNullable: true);'''
          migration.write_text(text[:match.start()] + reviewed + text[match.end():], encoding='utf-8')
      - name: Commit generated migration to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/LedgerForge.Infrastructure/Persistence/Migrations
          git commit -m 'Add forecast baseline snapshot migration'
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload generated migration files
        uses: actions/upload-artifact@v4
        with:
          name: ledgerforge-generated-forecast-baseline-migration
          if-no-files-found: error
          path: |
            src/LedgerForge.Infrastructure/Persistence/Migrations/*AddForecastBaselineSnapshot.cs
            src/LedgerForge.Infrastructure/Persistence/Migrations/*AddForecastBaselineSnapshot.Designer.cs
            src/LedgerForge.Infrastructure/Persistence/Migrations/LedgerForgeDbContextModelSnapshot.cs
