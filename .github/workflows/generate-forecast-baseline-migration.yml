name: generate-forecast-baseline-migration

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/generate-forecast-baseline-migration.yml'
  push:
    branches: [ 'agent/**' ]
    paths:
      - '.github/workflows/generate-forecast-baseline-migration.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore EF tool and solution
        run: |
          dotnet tool restore
          dotnet restore LedgerForge.slnx
      - name: Generate EF migration from the current model
        run: |
          dotnet ef migrations add AddForecastBaselineSnapshot \
            --project src/LedgerForge.Infrastructure/LedgerForge.Infrastructure.csproj \
            --startup-project src/LedgerForge.Web/LedgerForge.Web.csproj \
            --context LedgerForgeDbContext \
            --output-dir Persistence/Migrations
      - name: Preserve existing forecast baselines during upgrade
        shell: python
        run: |
          from pathlib import Path

          migration = next(Path('src/LedgerForge.Infrastructure/Persistence/Migrations').glob('*_AddForecastBaselineSnapshot.cs'))
          text = migration.read_text(encoding='utf-8-sig')
          generated = '''            migrationBuilder.AddColumn<decimal>(
                name: "BaselineTotal",
                table: "ForecastLine",
                type: "decimal(19,4)",
                nullable: false,
                defaultValue: 0m);'''
          reviewed = '''            migrationBuilder.AddColumn<decimal>(
                name: "BaselineTotal",
                table: "ForecastLine",
                type: "decimal(19,4)",
                nullable: true);

            migrationBuilder.Sql("""
                UPDATE [ForecastLine]
                SET [BaselineTotal] = [ForecastTotal]
                WHERE [BaselineTotal] IS NULL;
                """);

            migrationBuilder.AlterColumn<decimal>(
                name: "BaselineTotal",
                table: "ForecastLine",
                type: "decimal(19,4)",
                nullable: false,
                oldClrType: typeof(decimal),
                oldType: "decimal(19,4)",
                oldNullable: true);'''
          if generated not in text:
              raise SystemExit('Expected generated BaselineTotal AddColumn block was not found; review EF output manually.')
          migration.write_text(text.replace(generated, reviewed), encoding='utf-8')
      - name: Commit generated migration to branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/LedgerForge.Infrastructure/Persistence/Migrations
          git commit -m 'Add forecast baseline snapshot migration'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Upload generated migration files
        uses: actions/upload-artifact@v4
        with:
          name: ledgerforge-generated-forecast-baseline-migration
          if-no-files-found: error
          path: |
            src/LedgerForge.Infrastructure/Persistence/Migrations/*AddForecastBaselineSnapshot.cs
            src/LedgerForge.Infrastructure/Persistence/Migrations/*AddForecastBaselineSnapshot.Designer.cs
            src/LedgerForge.Infrastructure/Persistence/Migrations/LedgerForgeDbContextModelSnapshot.cs
