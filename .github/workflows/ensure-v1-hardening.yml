name: ensure-v1-hardening

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ensure-v1-hardening.yml'

permissions:
  contents: write

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Ensure release, hygiene, and fiscal-close hardening
        shell: python
        run: |
          from pathlib import Path

          release = Path('.github/workflows/release.yml')
          text = release.read_text(encoding='utf-8-sig')
          text = text.replace("        if: ${{ secrets.LEDGERFORGE_SIGNING_CERT_BASE64 != '' }}\n", "")
          marker = "          $pfx = Join-Path $env:RUNNER_TEMP 'ledgerforge-signing.pfx'\n"
          guard = """          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64)) {
            Write-Host 'No Authenticode signing certificate is configured; continuing with checksum-verified unsigned Setup.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PASSWORD)) {
            throw 'LEDGERFORGE_SIGNING_CERT_PASSWORD must be configured when a signing certificate is provided.'
          }
"""
          if "No Authenticode signing certificate is configured" not in text:
              if marker not in text:
                  raise SystemExit('Release signing insertion point not found.')
              text = text.replace(marker, guard + marker, 1)
          release.write_text(text, encoding='utf-8')

          hygiene = Path('.github/workflows/public-hygiene.yml')
          text = hygiene.read_text(encoding='utf-8-sig')
          text = text.replace(" -- ':!docs/PROJECT_HANDOFF.md'", " --")
          hygiene.write_text(text, encoding='utf-8')

          fiscal = Path('src/LedgerForge.Infrastructure/Budgeting/FiscalYearAdministrationService.cs')
          text = fiscal.read_text(encoding='utf-8-sig')
          text = text.replace("                  x.State != PurchaseOrderState.Rejected &&\n                  x.State != PurchaseOrderState.Issued,\n", "                  x.State != PurchaseOrderState.Rejected,\n")
          text = text.replace(
              'purchase order(s) are still draft, pending, or approved but not issued/closed.',
              'purchase order(s) are not explicitly closed, cancelled, or rejected.')
          fiscal.write_text(text, encoding='utf-8')

      - name: Self-remove and push normalized state
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ensure-v1-hardening.yml
          git add .github/workflows/release.yml .github/workflows/public-hygiene.yml src/LedgerForge.Infrastructure/Budgeting/FiscalYearAdministrationService.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Normalize final LedgerForge v1 hardening state'
          git push origin HEAD:${{ github.head_ref }}
