name: preserve-po-line-dimensions

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/preserve-po-line-dimensions.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Preserve existing coding when edit selections are omitted
        shell: python
        run: |
          from pathlib import Path

          controller = Path('src/LedgerForge.Web/Controllers/PurchaseOrderLinesController.cs')
          text = controller.read_text(encoding='utf-8-sig')
          marker = '''            line.Update(description, quantity, unitCost, budgetItemId, financeAccountId, departmentId, locationId);'''
          replacement = '''            budgetItemId ??= line.BudgetItemId;
              financeAccountId ??= line.FinanceAccountId;
              departmentId ??= line.DepartmentId;
              locationId ??= line.LocationId;
              line.Update(description, quantity, unitCost, budgetItemId, financeAccountId, departmentId, locationId);'''
          if replacement not in text:
              if marker not in text:
                  raise SystemExit('PO line update insertion point not found.')
              text = text.replace(marker, replacement, 1)
          controller.write_text(text, encoding='utf-8')

          view = Path('src/LedgerForge.Web/Views/PurchaseOrders/Details.cshtml')
          text = view.read_text(encoding='utf-8-sig')
          start = text.find('action="/purchase-orders/@Model.Order.Id/lines/@line.Id/update"')
          if start < 0:
              raise SystemExit('PO draft-line edit form not found.')
          end = text.find('</form>', start)
          block = text[start:end]
          block = block.replace('Unallocated / unchanged by code', 'Keep current budget item')
          block = block.replace('<option value="">Unallocated</option>', '<option value="">Keep current</option>')
          text = text[:start] + block + text[end:]
          view.write_text(text, encoding='utf-8')

      - name: Self-remove and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/preserve-po-line-dimensions.yml
          git add src/LedgerForge.Web/Controllers/PurchaseOrderLinesController.cs src/LedgerForge.Web/Views/PurchaseOrders/Details.cshtml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve purchase order line coding during edits'
          git push origin HEAD:${{ github.head_ref }}
