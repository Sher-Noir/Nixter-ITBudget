name: reconcile-v1-state

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/reconcile-v1-state.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Normalize final v1 source state
        shell: python
        run: |
          from pathlib import Path

          # Release signing: secrets are permitted in step env but not referenced from if expressions.
          release = Path('.github/workflows/release.yml')
          text = release.read_text(encoding='utf-8-sig')
          text = text.replace("        if: ${{ secrets.LEDGERFORGE_SIGNING_CERT_BASE64 != '' }}\n", "")
          marker = "          $pfx = Join-Path $env:RUNNER_TEMP 'ledgerforge-signing.pfx'\n"
          guard = """          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64)) {
            Write-Host 'No Authenticode signing certificate is configured; continuing with checksum-verified unsigned Setup.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PASSWORD)) {
            throw 'LEDGERFORGE_SIGNING_CERT_PASSWORD must be configured when a signing certificate is provided.'
          }
"""
          if 'No Authenticode signing certificate is configured' not in text:
              if marker not in text: raise SystemExit('Release signing insertion point missing.')
              text = text.replace(marker, guard + marker, 1)
          release.write_text(text, encoding='utf-8')

          # Public hygiene has no documentation exemption.
          hygiene = Path('.github/workflows/public-hygiene.yml')
          text = hygiene.read_text(encoding='utf-8-sig').replace(" -- ':!docs/PROJECT_HANDOFF.md'", " --")
          hygiene.write_text(text, encoding='utf-8')

          # Fiscal close requires every PO to be explicitly terminal.
          fiscal = Path('src/LedgerForge.Infrastructure/Budgeting/FiscalYearAdministrationService.cs')
          text = fiscal.read_text(encoding='utf-8-sig')
          text = text.replace("                  x.State != PurchaseOrderState.Rejected &&\n                  x.State != PurchaseOrderState.Issued,\n", "                  x.State != PurchaseOrderState.Rejected,\n")
          text = text.replace('purchase order(s) are still draft, pending, or approved but not issued/closed.', 'purchase order(s) are not explicitly closed, cancelled, or rejected.')
          fiscal.write_text(text, encoding='utf-8')

          # Active change-order uniqueness allows historical rejected/cancelled retries.
          db = Path('src/LedgerForge.Infrastructure/Persistence/LedgerForgeDbContext.cs')
          text = db.read_text(encoding='utf-8-sig')
          old_index = '            entity.HasIndex(x => x.SupersedesPurchaseOrderId).IsUnique().HasFilter("[SupersedesPurchaseOrderId] IS NOT NULL");'
          new_index = '''            entity.HasIndex(x => x.SupersedesPurchaseOrderId)
                      .IsUnique()
                      .HasFilter("[SupersedesPurchaseOrderId] IS NOT NULL AND [State] <> 5 AND [State] <> 6");'''
          if old_index in text: text = text.replace(old_index, new_index, 1)
          db.write_text(text, encoding='utf-8')

          # Change orders cannot reset already-active financial/receiving history.
          service = Path('src/LedgerForge.Infrastructure/Procurement/ProcurementService.cs')
          text = service.read_text(encoding='utf-8-sig')
          active_child = '''        if (await dbContext.PurchaseOrders.AnyAsync(
                  x => x.SupersedesPurchaseOrderId == source.Id && x.State != PurchaseOrderState.Cancelled && x.State != PurchaseOrderState.Rejected,
                  cancellationToken))
              throw new InvalidOperationException("This purchase order already has an active change order. Continue from that revision instead.");
'''
          create_guard = '''
          if (await dbContext.PurchaseReceipts.AsNoTracking().AnyAsync(x => x.PurchaseOrderId == source.Id, cancellationToken) ||
              await dbContext.Invoices.AsNoTracking().AnyAsync(
                  x => x.PurchaseOrderId == source.Id && x.State != InvoiceState.Cancelled && x.State != InvoiceState.Rejected,
                  cancellationToken))
              throw new InvalidOperationException("Create a change order before receiving or invoicing begins on the issued purchase order. Once financial/receiving activity exists, close the current PO and create a separately linked procurement record rather than resetting its commitment history.");
'''
          if 'Create a change order before receiving or invoicing begins' not in text:
              if active_child not in text: raise SystemExit('Change-order creation insertion point missing.')
              text = text.replace(active_child, active_child + create_guard, 1)
          source_state = '''            if (source.State != PurchaseOrderState.Issued)
                  throw new InvalidOperationException($"The superseded purchase order must still be Issued when the change order is issued; current state is {source.State}.");
              source.Close(actor, now);'''
          issue_guard = '''            if (source.State != PurchaseOrderState.Issued)
                  throw new InvalidOperationException($"The superseded purchase order must still be Issued when the change order is issued; current state is {source.State}.");
              if (await dbContext.PurchaseReceipts.AsNoTracking().AnyAsync(x => x.PurchaseOrderId == source.Id, cancellationToken) ||
                  await dbContext.Invoices.AsNoTracking().AnyAsync(
                      x => x.PurchaseOrderId == source.Id && x.State != InvoiceState.Cancelled && x.State != InvoiceState.Rejected,
                      cancellationToken))
                  throw new InvalidOperationException("The superseded purchase order received receiving/invoice activity after this revision was created. Cancel this draft revision and reconcile the active PO before attempting another change.");
              source.Close(actor, now);'''
          if 'received receiving/invoice activity after this revision was created' not in text:
              if source_state not in text: raise SystemExit('Change-order issue insertion point missing.')
              text = text.replace(source_state, issue_guard, 1)
          service.write_text(text, encoding='utf-8')

          # Blank recoding values preserve existing draft-line dimensions.
          controller = Path('src/LedgerForge.Web/Controllers/PurchaseOrderLinesController.cs')
          text = controller.read_text(encoding='utf-8-sig')
          update_call = '            line.Update(description, quantity, unitCost, budgetItemId, financeAccountId, departmentId, locationId);'
          preserve = '''            budgetItemId ??= line.BudgetItemId;
              financeAccountId ??= line.FinanceAccountId;
              departmentId ??= line.DepartmentId;
              locationId ??= line.LocationId;
              line.Update(description, quantity, unitCost, budgetItemId, financeAccountId, departmentId, locationId);'''
          if 'budgetItemId ??= line.BudgetItemId;' not in text:
              if update_call not in text: raise SystemExit('Draft-line update insertion point missing.')
              text = text.replace(update_call, preserve, 1)
          controller.write_text(text, encoding='utf-8')

          # Ensure draft line editing is reachable even if an earlier UI patch lost a race.
          view = Path('src/LedgerForge.Web/Views/PurchaseOrders/Details.cshtml')
          text = view.read_text(encoding='utf-8-sig')
          if 'lines/@line.Id/update' not in text:
              text += '''

@if (canManage && isDraft && Model.Lines.Count > 0)
{
    <section class="lf-card" aria-labelledby="edit-lines-title">
        <div class="lf-panel-header"><div><h2 id="edit-lines-title">Edit draft lines</h2><p class="lf-muted">Blank coding selections keep the line's current budget/account/department/location assignment.</p></div></div>
        @foreach (var line in Model.Lines)
        {
            <details>
                <summary>Line @line.LineNumber · @line.Description</summary>
                <form method="post" action="/purchase-orders/@Model.Order.Id/lines/@line.Id/update">
                    @Html.AntiForgeryToken()
                    <div class="lf-form-grid">
                        <div class="lf-span-all"><label>Description<input name="description" maxlength="500" required value="@line.Description" /></label></div>
                        <div><label>Quantity<input name="quantity" type="number" min="0.0001" step="0.0001" required value="@line.Quantity" /></label></div>
                        <div><label>Unit cost<input name="unitCost" type="number" min="0" step="0.0001" required value="@line.UnitCost" /></label></div>
                        <div><label>Budget item<select name="budgetItemId"><option value="">Keep current</option>@foreach (var option in Model.BudgetItems) { <option value="@option.Id">@option.Label</option> }</select></label></div>
                        <div><label>Finance account<select name="financeAccountId"><option value="">Keep current</option>@foreach (var option in Model.FinanceAccounts) { <option value="@option.Id">@option.Label</option> }</select></label></div>
                        <div><label>Department<select name="departmentId"><option value="">Keep current</option>@foreach (var option in Model.Departments) { <option value="@option.Id">@option.Label</option> }</select></label></div>
                        <div><label>Location<select name="locationId"><option value="">Keep current</option>@foreach (var option in Model.Locations) { <option value="@option.Id">@option.Label</option> }</select></label></div>
                    </div>
                    <p><button type="submit">Save line</button></p>
                </form>
                <form method="post" action="/purchase-orders/@Model.Order.Id/lines/@line.Id/delete">@Html.AntiForgeryToken()<button type="submit">Delete draft line</button></form>
            </details>
        }
    </section>
}
'''
          view.write_text(text, encoding='utf-8')

          # Minimal public-doc normalization if a prior documentation writer lost a race.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8-sig')
          if 'docs/architecture/v1-completion.md' not in text:
              text += '\n\n## LedgerForge v1\n\nSee [`docs/architecture/v1-completion.md`](docs/architecture/v1-completion.md) for the current feature/release contract and [`docs/GETTING_STARTED.md`](docs/GETTING_STARTED.md) for installation and first-run guidance.\n'
          readme.write_text(text.replace('Charles River Community Health', 'legacy organization').replace('CRCH', 'legacy organization'), encoding='utf-8')
          checklist = Path('docs/architecture/implementation-checklist.md')
          text = checklist.read_text(encoding='utf-8-sig')
          if 'superseded by' not in text.lower():
              checklist.write_text('# LedgerForge implementation checklist\n\nThis checklist is superseded by [`v1-completion.md`](v1-completion.md), the authoritative v1 feature and validation contract.\n', encoding='utf-8')
          handoff = Path('docs/PROJECT_HANDOFF.md')
          text = handoff.read_text(encoding='utf-8-sig').replace('Charles River Community Health', 'legacy organization').replace('CRCH', 'legacy organization')
          handoff.write_text(text, encoding='utf-8')

          # Ensure the full v1 gate marks PR #1 ready after both permanent jobs pass.
          gate = Path('.github/workflows/v1-release-gate.yml')
          text = gate.read_text(encoding='utf-8-sig')
          if '  ready-for-review:' not in text:
              text += '''

  ready-for-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1
    needs: [sql-and-tests, windows-package]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Mark LedgerForge foundation ready
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr ready "$PR_URL" || true
'''
          gate.write_text(text, encoding='utf-8')

      - name: Restore and build normalized source
        run: |
          dotnet tool restore
          dotnet restore LedgerForge.slnx
          dotnet build LedgerForge.slnx --configuration Release --no-restore

      - name: Generate retry migration only when absent
        shell: bash
        run: |
          set -euo pipefail
          if ! find src/LedgerForge.Infrastructure/Persistence/Migrations -maxdepth 1 -name '*_AllowChangeOrderRetry.cs' -print -quit | grep -q .; then
            dotnet ef migrations add AllowChangeOrderRetry \
              --project src/LedgerForge.Infrastructure/LedgerForge.Infrastructure.csproj \
              --startup-project src/LedgerForge.Web/LedgerForge.Web.csproj \
              --context LedgerForgeDbContext \
              --output-dir Persistence/Migrations
          fi
          dotnet ef migrations has-pending-model-changes \
            --project src/LedgerForge.Infrastructure/LedgerForge.Infrastructure.csproj \
            --startup-project src/LedgerForge.Web/LedgerForge.Web.csproj \
            --context LedgerForgeDbContext

      - name: Run all tests before push
        run: |
          dotnet test tests/LedgerForge.UnitTests/LedgerForge.UnitTests.csproj --configuration Release --no-build
          dotnet test tests/LedgerForge.IntegrationTests/LedgerForge.IntegrationTests.csproj --configuration Release --no-build
          dotnet test tests/LedgerForge.UiTests/LedgerForge.UiTests.csproj --configuration Release --no-build

      - name: Remove all one-shot workflows and commit reconciled tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/reconcile-v1-state.yml \
            .github/workflows/final-v1-maintenance.yml \
            .github/workflows/final-doc-refresh.yml \
            .github/workflows/ensure-v1-hardening.yml \
            .github/workflows/enable-v1-ready.yml \
            .github/workflows/enable-v1-automerge.yml \
            .github/workflows/fix-change-order-retry-migration.yml \
            .github/workflows/complete-change-order-editing.yml \
            .github/workflows/preserve-po-line-dimensions.yml
          git add .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No reconciliation changes were required.'
            exit 0
          fi
          git commit -m 'Reconcile final LedgerForge v1 state'
          git push origin HEAD:${{ github.head_ref }}
