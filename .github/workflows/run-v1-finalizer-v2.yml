name: run-v1-finalizer-v2

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/run-v1-finalizer-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Apply reconciled v1 source fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # Actual CSV import idempotency.
          path = 'src/LedgerForge.Infrastructure/Actuals/ActualCsvImportService.cs'
          text = read(path)
          if 'using System.Security.Cryptography;' not in text:
              text = text.replace('using System.Globalization;\n', 'using System.Globalization;\nusing System.Security.Cryptography;\n', 1)
          if 'var sourceHash = Convert.ToHexString(SHA256.HashData' not in text:
              marker = '        if (string.IsNullOrWhiteSpace(text)) return new(0, 0m, ["CSV file is empty."]);\n'
              if marker not in text: raise SystemExit('actual import hash insertion point missing')
              text = text.replace(marker, marker + '        var sourceHash = Convert.ToHexString(SHA256.HashData(Encoding.UTF8.GetBytes(text))).ToLowerInvariant();\n', 1)
          if 'var seenReferences = new HashSet<string>' not in text:
              marker = '        var errors = new List<string>();\n'
              if marker not in text: raise SystemExit('actual import duplicate set insertion point missing')
              text = text.replace(marker, marker + '        var seenReferences = new HashSet<string>(StringComparer.OrdinalIgnoreCase);\n', 1)
          text = text.replace('if (string.IsNullOrWhiteSpace(reference)) reference = $"import:{safeFileName}:row-{rowNumber}";', 'if (string.IsNullOrWhiteSpace(reference)) reference = $"import:{sourceHash}:row-{rowNumber}";')
          if 'duplicated within this import file' not in text:
              marker = '            if (string.IsNullOrWhiteSpace(reference)) reference = $"import:{sourceHash}:row-{rowNumber}";\n\n'
              if marker not in text: raise SystemExit('actual import reference insertion point missing')
              text = text.replace(marker, marker + '''            if (!seenReferences.Add(reference))
            {
                errors.Add($"Row {rowNumber}: source reference '{reference}' is duplicated within this import file.");
                continue;
            }

''', 1)
          if 'previously posted import reference(s)' not in text:
              marker = '        await using var transaction = await dbContext.Database.BeginTransactionAsync(cancellationToken);\n        dbContext.ActualTransactions.AddRange(pending);\n'
              if marker not in text: raise SystemExit('actual import transaction insertion point missing')
              text = text.replace(marker, '''        await using var transaction = await dbContext.Database.BeginTransactionAsync(System.Data.IsolationLevel.Serializable, cancellationToken);
        var importReferences = pending
            .Select(x => x.SourceReference)
            .Where(x => x is not null)
            .Select(x => x!)
            .Distinct(StringComparer.OrdinalIgnoreCase)
            .ToArray();
        var existingReferences = await dbContext.ActualTransactions.AsNoTracking()
            .Where(x => x.FiscalYearId == fiscalYearId &&
                        x.Kind == ActualTransactionKind.Import &&
                        x.SourceReference != null &&
                        importReferences.Contains(x.SourceReference))
            .Select(x => x.SourceReference!)
            .ToListAsync(cancellationToken);
        if (existingReferences.Count > 0)
        {
            await transaction.RollbackAsync(cancellationToken);
            var shown = string.Join(", ", existingReferences.Distinct(StringComparer.OrdinalIgnoreCase).Take(5));
            return new(0, 0m, [$"Import rejected because previously posted import reference(s) were found: {shown}. No rows were posted."]);
        }

        dbContext.ActualTransactions.AddRange(pending);
''', 1)
          write(path, text)

          path = 'tests/LedgerForge.IntegrationTests/ActualCsvImportIntegrationTests.cs'
          text = read(path)
          if 'duplicateStream' not in text:
              marker = '        Assert.Equal(2, await dbContext.ActualTransactions.CountAsync(x => x.FiscalYearId == year.Id));\n\n        var invalidCsv ='
              if marker not in text: raise SystemExit('actual import integration insertion point missing')
              text = text.replace(marker, '''        Assert.Equal(2, await dbContext.ActualTransactions.CountAsync(x => x.FiscalYearId == year.Id));

        await using (var duplicateStream = new MemoryStream(Encoding.UTF8.GetBytes(validCsv)))
        {
            var duplicate = await service.ImportAsync(year.Id, duplicateStream, ActualImportProfile.Default, "renamed-copy.csv");
            Assert.False(duplicate.Succeeded);
            Assert.Equal(0, duplicate.ImportedRows);
        }
        Assert.Equal(2, await dbContext.ActualTransactions.CountAsync(x => x.FiscalYearId == year.Id));

        var invalidCsv =''', 1)
          write(path, text)

          # Change-order safety.
          path = 'src/LedgerForge.Infrastructure/Procurement/ProcurementService.cs'
          text = read(path)
          if 'Create a change order before receiving or invoicing begins' not in text:
              marker = '            throw new InvalidOperationException("This purchase order already has an active change order. Continue from that revision instead.");\n\n'
              if marker not in text: raise SystemExit('change-order create insertion point missing')
              text = text.replace(marker, marker + '''        if (await dbContext.Set<PurchaseReceipt>().AsNoTracking().AnyAsync(x => x.PurchaseOrderId == source.Id, cancellationToken) ||
            await dbContext.Invoices.AsNoTracking().AnyAsync(
                x => x.PurchaseOrderId == source.Id && x.State != InvoiceState.Cancelled && x.State != InvoiceState.Rejected,
                cancellationToken))
            throw new InvalidOperationException("Create a change order before receiving or invoicing begins on the issued purchase order. Once activity exists, preserve the existing PO history and create a separately linked procurement record.");

''', 1)
          if 'received receiving/invoice activity after this revision was created' not in text:
              marker = '            if (source.State != PurchaseOrderState.Issued)\n                throw new InvalidOperationException($"The superseded purchase order must still be Issued when the change order is issued; current state is {source.State}.");\n            source.Close(actor, now);'
              if marker not in text: raise SystemExit('change-order issue insertion point missing')
              text = text.replace(marker, '''            if (source.State != PurchaseOrderState.Issued)
                throw new InvalidOperationException($"The superseded purchase order must still be Issued when the change order is issued; current state is {source.State}.");
            if (await dbContext.Set<PurchaseReceipt>().AsNoTracking().AnyAsync(x => x.PurchaseOrderId == source.Id, cancellationToken) ||
                await dbContext.Invoices.AsNoTracking().AnyAsync(
                    x => x.PurchaseOrderId == source.Id && x.State != InvoiceState.Cancelled && x.State != InvoiceState.Rejected,
                    cancellationToken))
                throw new InvalidOperationException("The superseded purchase order received receiving/invoice activity after this revision was created. Cancel this draft revision and reconcile the active PO before attempting another change.");
            source.Close(actor, now);''', 1)
          write(path, text)

          # Draft PO line editing UI.
          view = Path('src/LedgerForge.Web/Views/PurchaseOrders/Details.cshtml')
          text = view.read_text(encoding='utf-8-sig')
          if 'lines/@line.Id/update' not in text:
              text += '''

@if (canManage && isDraft && Model.Lines.Count > 0)
{
    <section class="lf-card" aria-labelledby="edit-lines-title">
        <div class="lf-panel-header"><div><h2 id="edit-lines-title">Edit draft lines</h2><p class="lf-muted">Update quantity, price, description, or coding before submission. Blank coding selections keep the current assignment.</p></div></div>
        @foreach (var line in Model.Lines)
        {
            <details>
                <summary>Line @line.LineNumber · @line.Description · @line.LineTotal.ToString("C2")</summary>
                <form method="post" action="/purchase-orders/@Model.Order.Id/lines/@line.Id/update">
                    @Html.AntiForgeryToken()
                    <div class="lf-form-grid">
                        <div class="lf-span-all"><label>Description<input name="description" maxlength="500" required value="@line.Description" /></label></div>
                        <div><label>Quantity<input name="quantity" type="number" min="0.0001" step="0.0001" required value="@line.Quantity" /></label></div>
                        <div><label>Unit cost<input name="unitCost" type="number" min="0" step="0.0001" required value="@line.UnitCost" /></label></div>
                        <div><label>Budget item<select name="budgetItemId"><option value="">Keep current</option>@foreach (var option in Model.BudgetItems) { <option value="@option.Id">@option.Label</option> }</select></label></div>
                        <div><label>Finance account<select name="financeAccountId"><option value="">Keep current</option>@foreach (var option in Model.FinanceAccounts) { <option value="@option.Id">@option.Label</option> }</select></label></div>
                        <div><label>Department<select name="departmentId"><option value="">Keep current</option>@foreach (var option in Model.Departments) { <option value="@option.Id">@option.Label</option> }</select></label></div>
                        <div><label>Location<select name="locationId"><option value="">Keep current</option>@foreach (var option in Model.Locations) { <option value="@option.Id">@option.Label</option> }</select></label></div>
                    </div>
                    <p><button type="submit">Save line</button></p>
                </form>
                <form method="post" action="/purchase-orders/@Model.Order.Id/lines/@line.Id/delete">@Html.AntiForgeryToken()<button type="submit">Delete draft line</button></form>
            </details>
        }
    </section>
}
'''
          view.write_text(text, encoding='utf-8')

          # Release signing guard.
          path = '.github/workflows/release.yml'
          text = read(path).replace("        if: ${{ secrets.LEDGERFORGE_SIGNING_CERT_BASE64 != '' }}\n", '')
          if 'No Authenticode signing certificate is configured' not in text:
              marker = "          $pfx = Join-Path $env:RUNNER_TEMP 'ledgerforge-signing.pfx'\n"
              if marker not in text: raise SystemExit('release signing insertion point missing')
              text = text.replace(marker, '''          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64)) {
            Write-Host 'No Authenticode signing certificate is configured; continuing with checksum-verified unsigned Setup.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PASSWORD)) {
            throw 'LEDGERFORGE_SIGNING_CERT_PASSWORD must be configured when a signing certificate is provided.'
          }
''' + marker, 1)
          write(path, text)

          # Public hygiene scanners without self-matching literals.
          scanner = '''      - name: Reject organization-specific legacy identifiers
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          needles = [('legacy organization name', ('Charles River Community' + ' Health').lower()), ('legacy organization acronym', ('CR' + 'CH').lower())]
          hits = []
          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\\0'):
              if not raw: continue
              path = Path(raw.decode())
              try: data = path.read_bytes()
              except OSError: continue
              if b'\\0' in data[:4096]: continue
              body = data.decode('utf-8', errors='ignore').lower()
              for label, needle in needles:
                  if needle in body: hits.append(f'{path}: {label}')
          if hits: raise SystemExit('Organization-specific legacy material was found in tracked public source:\\n' + '\\n'.join(hits))
          print('Legacy-identifier scan: PASS')

'''
          path = '.github/workflows/public-hygiene.yml'
          text = read(path)
          pattern = re.compile(r"      - name: Reject organization-specific legacy identifiers\n.*?(?=      - name: Reject common committed secret formats)", re.S)
          if not pattern.search(text): raise SystemExit('public hygiene block missing')
          write(path, pattern.sub(lambda _: scanner, text, count=1))

          path = '.github/workflows/v1-release-gate.yml'
          text = read(path)
          pattern = re.compile(r"      - name: Enforce public-source hygiene\n.*?(?=      - name: Common secret-pattern scan)", re.S)
          if not pattern.search(text): raise SystemExit('v1 hygiene block missing')
          replacement = '''      - name: Enforce public-source hygiene
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          needles = [('Charles River Community' + ' Health').lower(), ('CR' + 'CH').lower()]
          bad_ext = re.compile(r'\\.(xlsx?|xlsm|pfx|p12|snk)$', re.I)
          bad_dir = re.compile(r'(^|/)(App_Data|Documents|Uploads)/', re.I)
          hits=[]
          tracked=[Path(x.decode()) for x in subprocess.check_output(['git','ls-files','-z']).split(b'\\0') if x]
          for path in tracked:
              value=str(path).replace('\\\\','/')
              if bad_ext.search(value) or bad_dir.search(value): hits.append(f'{path}: private/data-bearing path'); continue
              try: data=path.read_bytes()
              except OSError: continue
              if b'\\0' in data[:4096]: continue
              body=data.decode('utf-8', errors='ignore').lower()
              if any(n in body for n in needles): hits.append(f'{path}: legacy identifier')
          if hits: raise SystemExit('Public-source hygiene failure:\\n' + '\\n'.join(hits))
          for workflow in list(Path('.github/workflows').glob('*.yml')) + list(Path('.github/workflows').glob('*.yaml')):
              body=workflow.read_text(encoding='utf-8', errors='ignore')
              if re.search(r'^\\s*if:.*secrets\\.', body, re.M): raise SystemExit(f'{workflow}: secrets must not be referenced directly from if expressions')
          print('V1 public-source hygiene: PASS')

'''
          write(path, pattern.sub(lambda _: replacement, text, count=1))

          # Source-contract test literals and public documentation.
          for path in ['tests/LedgerForge.UiTests/SecurityAndNavigationSmokeTests.cs', 'tests/LedgerForge.UiTests/V1CompletionContractTests.cs']:
              text = read(path).replace('"Charles River Community Health"', '"Charles River Community" + " Health"').replace('"CRCH"', '"CR" + "CH"')
              write(path, text)
          legacy_org='Charles River Community' + ' Health'; legacy_code='CR' + 'CH'
          for path in ['README.md', 'docs/PROJECT_HANDOFF.md', 'docs/architecture/implementation-checklist.md']:
              text=read(path).replace(legacy_org,'legacy organization').replace(legacy_code,'legacy organization')
              write(path,text)
          path='README.md'; text=read(path)
          if 'docs/architecture/v1-completion.md' not in text:
              text += '\n\n## LedgerForge v1\n\nSee [`docs/architecture/v1-completion.md`](docs/architecture/v1-completion.md) for the current v1 contract and [`docs/GETTING_STARTED.md`](docs/GETTING_STARTED.md) for installation and first-run guidance.\n'
              write(path,text)
          path='docs/architecture/implementation-checklist.md'; text=read(path)
          if 'superseded by' not in text.lower():
              write(path, '# LedgerForge implementation checklist\n\nThis checklist is superseded by [`v1-completion.md`](v1-completion.md), the authoritative v1 feature and validation contract.\n\n' + text)

      - name: Build and test reconciled source
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore LedgerForge.slnx
          dotnet build LedgerForge.slnx --configuration Release --no-restore
          dotnet ef migrations has-pending-model-changes \
            --project src/LedgerForge.Infrastructure/LedgerForge.Infrastructure.csproj \
            --startup-project src/LedgerForge.Web/LedgerForge.Web.csproj \
            --context LedgerForgeDbContext
          dotnet test tests/LedgerForge.UnitTests/LedgerForge.UnitTests.csproj --configuration Release --no-build
          dotnet test tests/LedgerForge.IntegrationTests/LedgerForge.IntegrationTests.csproj --configuration Release --no-build
          dotnet test tests/LedgerForge.UiTests/LedgerForge.UiTests.csproj --configuration Release --no-build

      - name: Remove temporary workflows and push repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/run-v1-finalizer-v2.yml \
            .github/workflows/run-v1-finalizer.yml \
            .github/workflows/finalize-v1-fixes.yml \
            .github/workflows/complete-change-order-editing.yml \
            .github/workflows/enable-v1-automerge.yml \
            .github/workflows/enable-v1-ready.yml \
            .github/workflows/ensure-v1-hardening.yml \
            .github/workflows/final-doc-refresh.yml \
            .github/workflows/final-v1-maintenance.yml \
            .github/workflows/harden-actual-import-idempotency.yml \
            .github/workflows/preserve-po-line-dimensions.yml \
            .github/workflows/reconcile-v1-state.yml \
            .github/workflows/remove-legacy-scan-literals.yml \
            .github/workflows/v1-merge-observer.yml
          git add src tests docs README.md .github/workflows/release.yml .github/workflows/public-hygiene.yml .github/workflows/v1-release-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile LedgerForge v1 release checks'
          git push origin HEAD:${{ github.head_ref }}
