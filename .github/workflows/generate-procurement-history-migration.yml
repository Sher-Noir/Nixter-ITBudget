name: generate-procurement-history-migration

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/generate-procurement-history-migration.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Configure procurement history model
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/LedgerForge.Infrastructure/Persistence/LedgerForgeDbContext.cs')
          text = path.read_text(encoding='utf-8-sig')

          old = '''    public DbSet<PurchaseOrder> PurchaseOrders => Set<PurchaseOrder>();
              public DbSet<PurchaseOrderLine> PurchaseOrderLines => Set<PurchaseOrderLine>();
              public DbSet<Invoice> Invoices => Set<Invoice>();'''
          new = '''    public DbSet<PurchaseOrder> PurchaseOrders => Set<PurchaseOrder>();
              public DbSet<PurchaseOrderLine> PurchaseOrderLines => Set<PurchaseOrderLine>();
              public DbSet<PurchaseReceipt> PurchaseReceipts => Set<PurchaseReceipt>();
              public DbSet<PurchaseReceiptLine> PurchaseReceiptLines => Set<PurchaseReceiptLine>();
              public DbSet<Invoice> Invoices => Set<Invoice>();'''
          if old not in text:
              raise SystemExit('Purchase-order DbSet insertion point not found.')
          text = text.replace(old, new, 1)

          po_start = text.index('        modelBuilder.Entity<PurchaseOrder>(entity =>')
          po_end = text.index('        modelBuilder.Entity<PurchaseOrderLine>(entity =>', po_start)
          po = text[po_start:po_end]

          to_table = '            entity.ToTable("PurchaseOrder");'
          if to_table not in po:
              raise SystemExit('PurchaseOrder ToTable configuration not found.')
          po = po.replace(
              to_table,
              '''            entity.ToTable("PurchaseOrder", table =>
                      {
                          table.HasCheckConstraint("CK_PurchaseOrder_ChangeOrder", "([SupersedesPurchaseOrderId] IS NULL AND [ChangeOrderSequence] = 0) OR ([SupersedesPurchaseOrderId] IS NOT NULL AND [ChangeOrderSequence] > 0)");
                      });''',
              1)

          cancellation = '            entity.Property(x => x.CancellationReason).HasMaxLength(1000);'
          if cancellation not in po:
              raise SystemExit('PurchaseOrder CancellationReason configuration not found.')
          po = po.replace(
              cancellation,
              cancellation + '''
                      entity.Property(x => x.ChangeOrderSequence).HasDefaultValue(0);
                      entity.Ignore(x => x.IsChangeOrder);''',
              1)

          vendor_index = '            entity.HasIndex(x => x.VendorId);'
          if vendor_index not in po:
              raise SystemExit('PurchaseOrder vendor index configuration not found.')
          po = po.replace(
              vendor_index,
              vendor_index + '''
                      entity.HasIndex(x => x.SupersedesPurchaseOrderId).IsUnique().HasFilter("[SupersedesPurchaseOrderId] IS NOT NULL");''',
              1)

          vendor_fk = '            entity.HasOne<Vendor>().WithMany().HasForeignKey(x => x.VendorId).OnDelete(DeleteBehavior.Restrict);'
          if vendor_fk not in po:
              raise SystemExit('PurchaseOrder vendor FK configuration not found.')
          po = po.replace(
              vendor_fk,
              vendor_fk + '''
                      entity.HasOne<PurchaseOrder>().WithMany().HasForeignKey(x => x.SupersedesPurchaseOrderId).OnDelete(DeleteBehavior.Restrict);''',
              1)

          text = text[:po_start] + po + text[po_end:]

          invoice_start = text.index('        modelBuilder.Entity<Invoice>(entity =>')
          receipt_config = '''        modelBuilder.Entity<PurchaseReceipt>(entity =>
              {
                  entity.ToTable("PurchaseReceipt");
                  entity.HasKey(x => x.Id);
                  entity.Property(x => x.ReceiptNumber).HasMaxLength(100).IsRequired();
                  entity.Property(x => x.ReceivedBy).HasMaxLength(256).IsRequired();
                  entity.Property(x => x.Note).HasMaxLength(1000);
                  entity.Property(x => x.RowVersion).IsRowVersion();
                  entity.HasIndex(x => new { x.PurchaseOrderId, x.ReceiptNumber }).IsUnique();
                  entity.HasIndex(x => new { x.PurchaseOrderId, x.ReceivedDate });
                  entity.HasOne<PurchaseOrder>().WithMany().HasForeignKey(x => x.PurchaseOrderId).OnDelete(DeleteBehavior.Restrict);
              });

              modelBuilder.Entity<PurchaseReceiptLine>(entity =>
              {
                  entity.ToTable("PurchaseReceiptLine", table =>
                      table.HasCheckConstraint("CK_PurchaseReceiptLine_Quantity", "[QuantityReceived] > 0"));
                  entity.HasKey(x => x.Id);
                  entity.Property(x => x.QuantityReceived).HasPrecision(19, 4);
                  entity.Property(x => x.Note).HasMaxLength(500);
                  entity.Property(x => x.RowVersion).IsRowVersion();
                  entity.HasIndex(x => new { x.PurchaseReceiptId, x.PurchaseOrderLineId }).IsUnique();
                  entity.HasIndex(x => x.PurchaseOrderLineId);
                  entity.HasOne<PurchaseReceipt>().WithMany().HasForeignKey(x => x.PurchaseReceiptId).OnDelete(DeleteBehavior.Restrict);
                  entity.HasOne<PurchaseOrderLine>().WithMany().HasForeignKey(x => x.PurchaseOrderLineId).OnDelete(DeleteBehavior.Restrict);
              });

          '''
          text = text[:invoice_start] + receipt_config + text[invoice_start:]
          path.write_text(text, encoding='utf-8')
      - name: Restore EF tool and solution
        run: |
          dotnet tool restore
          dotnet restore LedgerForge.slnx
      - name: Build before migration
        run: dotnet build LedgerForge.slnx --configuration Release --no-restore
      - name: Generate EF migration
        run: |
          dotnet ef migrations add AddProcurementHistory \
            --project src/LedgerForge.Infrastructure/LedgerForge.Infrastructure.csproj \
            --startup-project src/LedgerForge.Web/LedgerForge.Web.csproj \
            --context LedgerForgeDbContext \
            --output-dir Persistence/Migrations
      - name: Reject unexpected destructive Up operations
        shell: python
        run: |
          from pathlib import Path
          import re

          migration = next(Path('src/LedgerForge.Infrastructure/Persistence/Migrations').glob('*_AddProcurementHistory.cs'))
          text = migration.read_text(encoding='utf-8-sig')
          up = text.split('protected override void Down', 1)[0]
          destructive = re.findall(r'migrationBuilder\.(DropTable|DropColumn|DropForeignKey|DeleteData)\s*\(', up)
          if destructive:
              raise SystemExit(f'Unexpected destructive Up operation(s): {destructive}')
      - name: Commit model and generated migration to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/LedgerForge.Infrastructure/Persistence/LedgerForgeDbContext.cs src/LedgerForge.Infrastructure/Persistence/Migrations
          git commit -m 'Add procurement history migration'
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload migration review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ledgerforge-procurement-history-migration
          if-no-files-found: error
          path: |
            src/LedgerForge.Infrastructure/Persistence/Migrations/*AddProcurementHistory.cs
            src/LedgerForge.Infrastructure/Persistence/Migrations/*AddProcurementHistory.Designer.cs
            src/LedgerForge.Infrastructure/Persistence/Migrations/LedgerForgeDbContextModelSnapshot.cs
