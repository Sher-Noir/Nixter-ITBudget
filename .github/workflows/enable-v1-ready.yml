name: enable-v1-ready

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/enable-v1-ready.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Add gated ready-for-review job
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/v1-release-gate.yml')
          text = path.read_text(encoding='utf-8-sig')
          if '  ready-for-review:' not in text:
              text += '''

  ready-for-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1
    needs: [sql-and-tests, windows-package]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Mark LedgerForge foundation ready
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr ready "$PR_URL"
'''
          path.write_text(text, encoding='utf-8')
      - name: Self-remove and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/enable-v1-ready.yml
          git add .github/workflows/v1-release-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Gate LedgerForge PR readiness on v1 validation'
          git push origin HEAD:${{ github.head_ref }}
