name: remove-legacy-scan-literals

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/remove-legacy-scan-literals.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Remove forbidden literals from scanner source
        shell: python
        run: |
          from pathlib import Path

          for file in [Path('.github/workflows/public-hygiene.yml'), Path('.github/workflows/v1-release-gate.yml')]:
              text = file.read_text(encoding='utf-8-sig')
              text = text.replace(
                  "          if git grep -n -i -E 'Charles River Community Health|\\bCRCH\\b' --; then",
                  "          legacy_name='Charles River Community'' Health'\n          legacy_acronym='CR''CH'\n          if git grep -n -i -E \"${legacy_name}|\\\\b${legacy_acronym}\\\\b\" --; then")
              file.write_text(text, encoding='utf-8')

          for file in [Path('tests/LedgerForge.UiTests/SecurityAndNavigationSmokeTests.cs'), Path('tests/LedgerForge.UiTests/V1CompletionContractTests.cs')]:
              text = file.read_text(encoding='utf-8-sig')
              text = text.replace('Assert.DoesNotContain("Charles River Community Health", settings, StringComparison.OrdinalIgnoreCase);', 'Assert.DoesNotContain("Charles River Community" + " Health", settings, StringComparison.OrdinalIgnoreCase);')
              text = text.replace('Assert.DoesNotContain("CRCH", settings, StringComparison.OrdinalIgnoreCase);', 'Assert.DoesNotContain("CR" + "CH", settings, StringComparison.OrdinalIgnoreCase);')
              text = text.replace('Assert.DoesNotContain("Charles River Community Health", readme, StringComparison.OrdinalIgnoreCase);', 'Assert.DoesNotContain("Charles River Community" + " Health", readme, StringComparison.OrdinalIgnoreCase);')
              text = text.replace('Assert.DoesNotContain("CRCH", readme, StringComparison.OrdinalIgnoreCase);', 'Assert.DoesNotContain("CR" + "CH", readme, StringComparison.OrdinalIgnoreCase);')
              file.write_text(text, encoding='utf-8')

      - name: Verify scanner source contains no forbidden literal
        shell: bash
        run: |
          set -euo pipefail
          legacy_name='Charles River Community'' Health'
          legacy_acronym='CR''CH'
          if git grep -n -i -E "${legacy_name}|\\b${legacy_acronym}\\b" --; then
            echo 'A tracked legacy identifier remains.'
            exit 1
          fi

      - name: Self-remove and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/remove-legacy-scan-literals.yml
          git add .github/workflows/public-hygiene.yml .github/workflows/v1-release-gate.yml tests/LedgerForge.UiTests/SecurityAndNavigationSmokeTests.cs tests/LedgerForge.UiTests/V1CompletionContractTests.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make public hygiene scan self-safe'
          git push origin HEAD:${{ github.head_ref }}
