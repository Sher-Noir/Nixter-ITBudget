name: public-hygiene

on:
  push:
    branches: [ main, 'agent/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject organization-specific legacy identifiers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -i -E 'Charles River Community Health|\bCRCH\b' -- ':!docs/PROJECT_HANDOFF.md'; then
            echo 'Organization-specific legacy material was found in tracked public source.'
            exit 1
          fi

      - name: Reject common committed secret formats
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          patterns = [
              ('private key', re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----')),
              ('GitHub token', re.compile(rb'gh[pousr]_[A-Za-z0-9]{30,}')),
              ('AWS access key', re.compile(rb'AKIA[0-9A-Z]{16}')),
              ('Slack token', re.compile(rb'xox[baprs]-[A-Za-z0-9-]{20,}')),
          ]
          hits = []
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode())
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b'\x00' in data[:4096]:
                  continue
              for label, pattern in patterns:
                  if pattern.search(data):
                      hits.append(f'{path}: {label}')
          if hits:
              raise SystemExit('Potential committed secret material:\n' + '\n'.join(hits))
          print('Public-source secret-pattern scan: PASS')

      - name: Reject tracked migration workbooks and private deployment data
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E -i '\.(xlsx?|xlsm|pfx|p12|snk)$|(^|/)(App_Data|Documents|Uploads)/' || true)
          if [ -n "$bad" ]; then
            echo 'Private/data-bearing artifact types must not be tracked:'
            echo "$bad"
            exit 1
          fi
          echo 'Tracked data-artifact scan: PASS'
