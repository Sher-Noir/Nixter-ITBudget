name: fix-change-order-retry-migration

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-change-order-retry-migration.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Allow retry after rejected or cancelled change orders
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/LedgerForge.Infrastructure/Persistence/LedgerForgeDbContext.cs')
          text = path.read_text(encoding='utf-8-sig')
          old = '''            entity.HasIndex(x => x.SupersedesPurchaseOrderId).IsUnique().HasFilter("[SupersedesPurchaseOrderId] IS NOT NULL");'''
          new = '''            entity.HasIndex(x => x.SupersedesPurchaseOrderId)
                      .IsUnique()
                      .HasFilter("[SupersedesPurchaseOrderId] IS NOT NULL AND [State] <> 5 AND [State] <> 6");'''
          if old not in text:
              if new not in text:
                  raise SystemExit('Expected change-order lineage index configuration not found.')
          else:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Restore and generate EF migration
        run: |
          dotnet tool restore
          dotnet restore LedgerForge.slnx
          dotnet build LedgerForge.slnx --configuration Release --no-restore
          dotnet ef migrations add AllowChangeOrderRetry \
            --project src/LedgerForge.Infrastructure/LedgerForge.Infrastructure.csproj \
            --startup-project src/LedgerForge.Web/LedgerForge.Web.csproj \
            --context LedgerForgeDbContext \
            --output-dir Persistence/Migrations

      - name: Review migration Up operations
        shell: python
        run: |
          from pathlib import Path
          migration = next(Path('src/LedgerForge.Infrastructure/Persistence/Migrations').glob('*_AllowChangeOrderRetry.cs'))
          text = migration.read_text(encoding='utf-8-sig')
          up = text.split('protected override void Down', 1)[0]
          forbidden = ['DropTable(', 'DropColumn(', 'DeleteData(']
          hits = [token for token in forbidden if token in up]
          if hits:
              raise SystemExit('Unexpected destructive operation(s): ' + ', '.join(hits))
          if 'DropIndex(' not in up or 'CreateIndex(' not in up or 'State] <> 5' not in up or 'State] <> 6' not in up:
              raise SystemExit('Expected filtered change-order index replacement was not generated.')

      - name: Remove generator and commit model/migration
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-change-order-retry-migration.yml
          git add src/LedgerForge.Infrastructure/Persistence/LedgerForgeDbContext.cs src/LedgerForge.Infrastructure/Persistence/Migrations
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Allow retry after rejected change orders'
          git push origin HEAD:${{ github.head_ref }}
