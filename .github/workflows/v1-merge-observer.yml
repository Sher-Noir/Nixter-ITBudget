name: v1-merge-observer

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ledgerforge-v1-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge-after-green:
    if: github.event.pull_request.number == 1 && github.event.pull_request.head.ref == 'agent/initial-scaffold'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Refuse to merge with leftover one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          leftovers=$(find .github/workflows -maxdepth 1 -type f \( \
            -name 'reconcile-v1-state.yml' -o \
            -name 'final-v1-maintenance.yml' -o \
            -name 'final-doc-refresh.yml' -o \
            -name 'ensure-v1-hardening.yml' -o \
            -name 'enable-v1-ready.yml' -o \
            -name 'enable-v1-automerge.yml' -o \
            -name 'fix-change-order-retry-migration.yml' -o \
            -name 'complete-change-order-editing.yml' -o \
            -name 'preserve-po-line-dimensions.yml' -o \
            -name 'remove-legacy-scan-literals.yml' -o \
            -name 'harden-actual-import-idempotency.yml' \
          \) -print)
          if [ -n "$leftovers" ]; then
            echo 'Temporary workflow(s) still exist; a later PR-head update will retrigger this observer after they self-remove:'
            echo "$leftovers"
            exit 1
          fi

      - name: Wait for v1 release gate on this exact source head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            current_sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
            if [ "$current_sha" != "$EXPECTED_SHA" ]; then
              echo 'PR head moved; a newer observer run will own the new head.'
              exit 0
            fi
            record=$(gh run list --repo "$REPO" --workflow v1-release-gate.yml --branch "$HEAD_BRANCH" --event pull_request --limit 30 \
              --json headSha,status,conclusion,databaseId \
              --jq ".[] | select(.headSha == \"$EXPECTED_SHA\") | [.databaseId,.status,(.conclusion // \"\")] | @tsv" | head -n 1 || true)
            if [ -n "$record" ]; then
              IFS=$'\t' read -r run_id status conclusion <<< "$record"
              echo "v1 gate run $run_id: $status $conclusion"
              if [ "$status" = 'completed' ] && [ "$conclusion" = 'success' ]; then
                exit 0
              fi
              if [ "$status" = 'completed' ] && [ "$conclusion" != 'success' ]; then
                echo 'The exact-head v1 release gate failed; merge is blocked.'
                exit 1
              fi
            fi
            sleep 15
          done
          echo 'Timed out waiting for the exact-head v1 release gate.'
          exit 1

      - name: Remove this temporary observer from the PR branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v1-merge-observer.yml
          git commit -m 'Remove v1 merge observer'
          git push origin HEAD:"$HEAD_BRANCH"
          echo "CLEAN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for clean-head v1 release gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            current_sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
            if [ "$current_sha" != "$CLEAN_SHA" ]; then
              echo 'PR head changed after observer cleanup; refusing to merge a different head.'
              exit 1
            fi
            record=$(gh run list --repo "$REPO" --workflow v1-release-gate.yml --branch "$HEAD_BRANCH" --event pull_request --limit 30 \
              --json headSha,status,conclusion,databaseId \
              --jq ".[] | select(.headSha == \"$CLEAN_SHA\") | [.databaseId,.status,(.conclusion // \"\")] | @tsv" | head -n 1 || true)
            if [ -n "$record" ]; then
              IFS=$'\t' read -r run_id status conclusion <<< "$record"
              echo "clean-head v1 gate run $run_id: $status $conclusion"
              if [ "$status" = 'completed' ] && [ "$conclusion" = 'success' ]; then
                break
              fi
              if [ "$status" = 'completed' ] && [ "$conclusion" != 'success' ]; then
                echo 'The clean-head v1 release gate failed; merge is blocked.'
                exit 1
              fi
            fi
            sleep 15
          done
          current_sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          [ "$current_sha" = "$CLEAN_SHA" ] || exit 1

      - name: Mark ready and merge the validated clean head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr ready "$PR" --repo "$REPO" || true
          gh api --method PUT "repos/$REPO/pulls/$PR/merge" \
            -f merge_method=squash \
            -f sha="$CLEAN_SHA" \
            -f commit_title='LedgerForge v1' \
            -f commit_message='Feature-complete LedgerForge v1 foundation validated by the consolidated SQL/test/Windows release gate.'
